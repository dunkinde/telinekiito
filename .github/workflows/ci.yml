# Checks only – nothing here deploys. (Production deploys come from the server's own timer on `main`.)
name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit/API tests, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # No lockfile in web/ (it isn't committed), so the cache key follows package.json.
          cache-dependency-path: web/package.json
      - name: Unit and API tests
        run: npm test
      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Web typecheck
        working-directory: web
        run: npx tsc --noEmit -p tsconfig.json
      - name: Web build
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
      - name: Keep the built site for the e2e job
        uses: actions/upload-artifact@v4
        with:
          name: web-out
          path: web/out
          retention-days: 3

  e2e:
    name: End-to-end (Playwright)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: web-out
          path: web/out
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run e2e tests
        working-directory: e2e
        run: npx playwright test
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
